<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Réponses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <div class="admin-container">
    <header>
      <h1>🛡️ Interface Admin</h1>
      <p class="subtitle">Les questions des utilisateurs apparaissent ici</p>
    </header>

    <div id="login-box" class="login-box">
      <input type="password" id="password-input" placeholder="Mot de passe admin">
      <button id="login-btn">Se connecter</button>
      <p id="login-error" class="error"></p>
    </div>

    <div id="admin-panel" class="admin-panel hidden">
      <div id="questions-list" class="questions-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
